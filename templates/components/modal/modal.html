{{define "modal"}}
<!-- Modal -->
<div id="modal-overlay" class="fixed inset-0 z-[100] hidden">
    <div class="absolute inset-0 bg-[color-mix(in_srgb,_var(--color-surface-variant)_40%,_transparent)] backdrop-blur-md" data-action="close-modal"></div>
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-full max-w-lg p-4 sm:p-6">
        <div id="modal-content" class="bg-[var(--color-surface-container-low)] rounded-xl shadow-2xl overflow-hidden flex flex-col relative">
        </div>
    </div>
</div>

<!-- Modal Template -->
<template id="modal-template">
    <!-- Modal Header -->
    <div class="px-6 py-5 border-b border-[color-mix(in_srgb,_var(--color-outline-variant)_30%,_transparent)] flex justify-between items-center">
        <h2 id="modal-title" class="font-headline-sm text-headline-sm text-[var(--color-on-surface)]">{{.Modal.Title.Add}}</h2>
        <button data-action="close-modal" class="text-[var(--color-on-surface-variant)] hover:text-[var(--color-on-surface)] transition-colors rounded-full p-1 hover:bg-[var(--color-surface-container-highest)]" aria-label="{{.Modal.Close}}">
            <span class="material-symbols-outlined">close</span>
        </button>
    </div>

    <!-- Modal Body (Form) -->
    <div class="px-6 py-6 overflow-y-auto max-h-[70vh]">
        <form id="app-form">
            <input type="hidden" id="form-id" value="">

            <!-- App Name -->
            <div class="mb-5">
                <label class="block font-label-md text-label-md text-[var(--color-on-surface-variant)] mb-2" for="form-name">{{.Modal.Label.AppName}} <span class="required">*</span></label>
                <input type="text" id="form-name" required class="w-full bg-[var(--color-surface)] border border-[color-mix(in_srgb,_var(--color-outline-variant)_50%,_transparent)] rounded-lg px-4 py-2.5 text-body-md text-[var(--color-on-surface)] focus:outline-none focus:ring-2 focus:ring-[var(--color-primary)] focus:border-transparent transition-shadow placeholder:text-[color-mix(in_srgb,_var(--color-on-surface-variant)_50%,_transparent)] form-input" placeholder="{{.Modal.Placeholder.AppName}}">
                <p id="form-name-error" class="hidden text-xs text-[var(--color-red)] mt-1.5 font-medium"></p>
            </div>

            <!-- URL -->
            <div class="mb-5">
                <label class="block font-label-md text-label-md text-[var(--color-on-surface-variant)] mb-2" for="form-url">{{.Modal.Label.URL}} <span class="required">*</span></label>
                <input type="url" id="form-url" required class="w-full bg-[var(--color-surface)] border border-[color-mix(in_srgb,_var(--color-outline-variant)_50%,_transparent)] rounded-lg px-4 py-2.5 text-body-md text-[var(--color-on-surface)] focus:outline-none focus:ring-2 focus:ring-[var(--color-primary)] focus:border-transparent transition-shadow placeholder:text-[color-mix(in_srgb,_var(--color-on-surface-variant)_50%,_transparent)] form-input" placeholder="{{.Modal.Placeholder.URL}}">
                <p id="form-url-error" class="hidden text-xs text-[var(--color-red)] mt-1.5 font-medium"></p>
            </div>

            <!-- Icon Selection -->
            <div class="mb-5">
                <label class="block font-label-md text-label-md text-[var(--color-on-surface-variant)] mb-2">{{.Modal.Label.Icon}}</label>
                <div class="bg-[var(--color-surface)] border border-[color-mix(in_srgb,_var(--color-outline-variant)_50%,_transparent)] rounded-xl overflow-hidden flex flex-col">
                    <!-- Search Input -->
                    <div class="p-3 border-b border-[color-mix(in_srgb,_var(--color-outline-variant)_30%,_transparent)] flex items-center gap-2">
                        <span class="material-symbols-outlined text-[var(--color-on-surface-variant)] opacity-50">search</span>
                        <input type="text" id="icon-search" class="flex-grow bg-transparent border-none focus:ring-0 text-body-md p-0 placeholder:text-[color-mix(in_srgb,_var(--color-on-surface-variant)_50%,_transparent)]" placeholder="{{.Modal.Placeholder.IconSearch}}">
                        <div id="icon-selected-display" class="hidden flex items-center gap-2 cursor-pointer flex-grow">
                            <img id="icon-selected-img" src="" alt="" class="icon-selected-preview w-5 h-5 object-contain">
                            <span id="icon-selected-name" class="text-body-md text-[var(--color-on-surface)] truncate"></span>
                        </div>
                    </div>
                    <!-- Scrollable Icon Grid -->
                    <div id="icon-grid-container" class="p-4 max-h-64 overflow-y-auto">
                        <div id="material-icons-grid" class="grid grid-cols-5 gap-3">
                            <!-- Icons will be populated by JS -->
                        </div>
                    </div>
                </div>
                <input type="hidden" id="form-icon" value="">
            </div>

            <!-- Gradient (hidden, default value) -->
            <input type="hidden" id="form-gradient" value="grad-blue">

        </form>
    </div>

    <!-- Modal Footer (Actions) -->
    <div class="px-6 py-4 bg-[var(--color-surface-container)] border-t border-[color-mix(in_srgb,_var(--color-outline-variant)_20%,_transparent)] flex justify-end gap-3 rounded-b-xl">
        <button type="button" data-action="close-modal" class="px-5 py-2.5 font-label-md text-label-md font-semibold text-[var(--color-primary)] hover:bg-[color-mix(in_srgb,_var(--color-primary)_10%,_transparent)] rounded-lg transition-colors focus:outline-none focus:ring-2 focus:ring-[var(--color-primary)]">
            {{.Modal.Button.Cancel}}
        </button>
        <button type="button" id="save-btn" class="px-5 py-2.5 font-label-md text-label-md font-semibold bg-[var(--color-primary)] text-[var(--color-on-primary)] hover:bg-[color-mix(in_srgb,_var(--color-primary)_90%,_black)] rounded-lg shadow-sm transition-colors focus:outline-none focus:ring-2 focus:ring-[var(--color-primary)] focus:ring-offset-2 focus:ring-offset-[var(--color-surface-container)] disabled:opacity-60 disabled:cursor-not-allowed flex items-center justify-center min-w-[100px]">
            <span id="save-btn-text">{{.Modal.Button.Save}}</span>
        </button>
    </div>
</template>

<!-- Confirm Dialog -->
<div id="confirm-overlay" class="fixed inset-0 z-[200] hidden">
    <div class="absolute inset-0 bg-[color-mix(in_srgb,_var(--color-surface-variant)_40%,_transparent)] backdrop-blur-md" id="confirm-backdrop"></div>
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-full max-w-sm p-4 sm:p-6">
        <div class="bg-[var(--color-surface-container-low)] rounded-xl shadow-2xl overflow-hidden flex flex-col">
            <div class="px-6 py-5 border-b border-[color-mix(in_srgb,_var(--color-outline-variant)_30%,_transparent)]">
                <h2 id="confirm-title" class="font-headline-sm text-headline-sm text-[var(--color-on-surface)]">{{.Confirm.Title}}</h2>
            </div>
            <div class="px-6 py-6">
                <p id="confirm-message" class="text-body-md text-[var(--color-on-surface-variant)]"></p>
            </div>
            <div class="px-6 py-4 bg-[var(--color-surface-container)] border-t border-[color-mix(in_srgb,_var(--color-outline-variant)_20%,_transparent)] flex justify-end gap-3 rounded-b-xl">
                <button type="button" id="confirm-cancel" class="px-5 py-2.5 font-label-md text-label-md font-semibold text-[var(--color-primary)] hover:bg-[color-mix(in_srgb,_var(--color-primary)_10%,_transparent)] rounded-lg transition-colors focus:outline-none focus:ring-2 focus:ring-[var(--color-primary)]">
                    {{.Confirm.Button.Cancel}}
                </button>
                <button type="button" id="confirm-ok" class="px-5 py-2.5 font-label-md text-label-md font-semibold bg-[var(--color-red)] text-[var(--color-on-primary)] hover:bg-[color-mix(in_srgb,_var(--color-red)_90%,_black)] rounded-lg shadow-sm transition-colors focus:outline-none focus:ring-2 focus:ring-[var(--color-red)] focus:ring-offset-2 focus:ring-offset-[var(--color-surface-container)]">
                    {{.Confirm.Button.Delete}}
                </button>
            </div>
        </div>
    </div>
</div>
{{end}}
