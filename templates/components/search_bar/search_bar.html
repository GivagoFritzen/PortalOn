{{define "search_bar"}}
<div class="flex-1 max-w-md mx-8 hidden md:block">
    <div class="relative glass-search rounded-full overflow-hidden transition-all duration-300 focus-within:ring-2 focus-within:ring-[color-mix(in_srgb,_var(--color-primary)_20%,_transparent)]">
        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
            <span class="material-symbols-outlined text-[var(--color-outline)]">search</span>
        </div>
        <input
            id="search-input"
            class="block w-full pl-11 pr-4 py-2 bg-transparent border-none text-body-md focus:ring-0 text-[var(--color-on-surface)]"
            placeholder="{{.Search.Placeholder}}"
            type="text"
            name="q"
        >
    </div>
</div>
{{end}}
