{{define "app_card"}}
<a class="app-item group flex flex-col items-center focus:outline-none transition-transform active:scale-95 app-card" 
   href="{{.URL}}" target="_blank" rel="noopener noreferrer" data-id="{{.ID}}" data-url="{{.URL}}">
    <div class="relative w-[84px] h-[84px] sm:w-[88px] sm:h-[88px] squircle bg-[var(--color-surface-container-lowest)] 
         border border-[color-mix(in_srgb,_var(--color-outline-variant)_40%,_transparent)] squircle-shadow
         flex items-center justify-center transition-all
         group-hover:-translate-y-1 group-hover:border-[color-mix(in_srgb,_var(--color-primary)_40%,_transparent)] group-hover:bg-[var(--color-surface-container-high)]
         flex items-center justify-center transition-all">
<img src="{{iconPath .Icon}}" alt="{{.Name}}" 
              class="w-3/4 h-3/4 object-contain">
        {{if .IsOnline}}
        <span class="absolute -top-1 -right-1 w-3 h-3 rounded-full bg-[#22c55e] 
              ring-2 ring-[var(--color-bg)] dark:ring-[var(--color-bg)] shadow-sm z-10 status-dot"
              data-app-id="{{.ID}}"></span>
        {{else}}
        <span class="absolute -top-1 -right-1 w-3 h-3 rounded-full bg-[#ef4444] 
              ring-2 ring-[var(--color-bg)] dark:ring-[var(--color-bg)] shadow-sm z-10 status-dot"
              data-app-id="{{.ID}}"></span>
        {{end}}
        <div hx-get="/api/apps/{{.ID}}/status" hx-trigger="every 60s" hx-swap="outerHTML" hx-target="this" 
             class="absolute -top-1 -right-1"></div>
    </div>
    <span class="mt-3.5 font-label-md text-label-md text-[var(--color-on-surface)] 
         group-hover:text-[var(--color-primary)] transition-colors tracking-normal">
        {{.Name}}
    </span>
    <div class="edit-controls hidden mt-2 flex gap-2">
        <button data-action="edit-app" data-app-id="{{.ID}}" 
                class="px-2 py-1 text-xs bg-[var(--color-primary)] text-[var(--color-on-primary)] rounded hover:bg-[color-mix(in_srgb,_var(--color-primary)_80%,_black)] transition-colors">Edit</button>
        <button data-action="delete-app" data-app-id="{{.ID}}" 
                class="px-2 py-1 text-xs bg-[var(--color-red)] text-[var(--color-on-primary)] rounded hover:bg-[color-mix(in_srgb,_var(--color-red)_90%,_black)] transition-colors">Delete</button>
    </div>
</a>
{{end}}
